<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 예전 주소 호환용 (tools/pages.py 가 만듭니다) -->
  <title>MCUS 2027</title>
  <link rel="canonical" href="2027/">
  <meta http-equiv="refresh" content="0; url=2027/">
  <script>
    (function () {
      var h = decodeURIComponent(location.hash.slice(1)).split('/');
      var key = h[0], arg = h[1];
      if (/^d\d+-(t|lt)\d*$/.test(key || '')) { arg = key; key = 'abstract'; }
      var routes = ['schedule', 'abstract', 'registration', 'venue', 'gallery'];
      var path = routes.indexOf(key) >= 0 ? key + '/' : '';
      location.replace('2027/' + path + (arg ? '#' + arg : ''));
    })();
  </script>
</head>
<body><a href="2027/">MCUS 2027 페이지로 이동</a></body>
</html>
